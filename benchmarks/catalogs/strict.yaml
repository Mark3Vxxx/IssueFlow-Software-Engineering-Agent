dataset_split: strict
cases:
  - id: mingpt-h01
    dataset_split: strict
    repository_id: mingpt
    environment_id: mingpt
    kind: historical
    budget_profile: small
    difficulty: small
    issue_category: numerical
    repository_url: https://github.com/karpathy/minGPT
    revision: 5433de6158cc8bf9f1bf6c79b4e408292d6bc394
    license: MIT
    issue: top_k_logits masks sub-top-k logits to 1e-10 instead of negative infinity, giving excluded tokens a non-zero sampling probability.
    source_url: https://github.com/karpathy/minGPT/commit/8909e1b646d6fd5235ec33259fb22fdc2c91037c
    reproduce_command: python -c "import torch; from mingpt.utils import top_k_logits; out = top_k_logits(torch.tensor([[5.0, 3.0, 1.0]]), 1); assert out[0, 1] == float('-inf') and out[0, 2] == float('-inf'), out"
    verify_command: python -c "import torch; from mingpt.utils import top_k_logits; out = top_k_logits(torch.tensor([[5.0, 3.0, 1.0]]), 1); assert out[0, 1] == float('-inf') and out[0, 2] == float('-inf'), out"
    reference_patch: mingpt-h01/reference.patch
    construction_notes: Historical repair from commit 8909e1b; sampling mask used 1e-10 instead of -inf.
    hidden_test_path: mingpt-h01/test_hidden.py
    hidden_verify_command: python -m pytest /issueflow-hidden/test_hidden.py
    fixed_revision: 8909e1b646d6fd5235ec33259fb22fdc2c91037c
  - id: nanogpt-h01
    dataset_split: strict
    repository_id: nanogpt
    environment_id: nanogpt
    kind: historical
    budget_profile: small
    difficulty: small
    issue_category: model_training
    repository_url: https://github.com/karpathy/nanoGPT
    revision: a82b33b525ca9855d705656387698e13eb8e8d4b
    license: MIT
    issue: GPT.crop_block_size unconditionally accesses block.attn.bias, which does not exist when flash attention is enabled, causing an AttributeError.
    source_url: https://github.com/karpathy/nanoGPT/commit/c3f254844d63ece0b6481e9d9777d740a66eb965
    reproduce_command: python -c "import torch; from model import GPT, GPTConfig; m = GPT(GPTConfig(block_size=64, n_layer=2, n_head=2, n_embd=16)); m.crop_block_size(32)"
    verify_command: python -c "import torch; from model import GPT, GPTConfig; m = GPT(GPTConfig(block_size=64, n_layer=2, n_head=2, n_embd=16)); m.crop_block_size(32)"
    reference_patch: nanogpt-h01/reference.patch
    construction_notes: Historical repair from commit c3f2548; crop_block_size crashed under flash attention.
    hidden_test_path: nanogpt-h01/test_hidden.py
    hidden_verify_command: python -m pytest /issueflow-hidden/test_hidden.py
    fixed_revision: c3f254844d63ece0b6481e9d9777d740a66eb965
  - id: nanogpt-h02
    dataset_split: strict
    repository_id: nanogpt
    environment_id: nanogpt
    kind: historical
    budget_profile: small
    difficulty: small
    issue_category: model_training
    repository_url: https://github.com/karpathy/nanoGPT
    revision: a82b33b525ca9855d705656387698e13eb8e8d4b
    license: MIT
    issue: scaled_dot_product_attention is called with dropout_p=self.dropout unconditionally, so dropout is applied even in eval mode, making inference non-deterministic.
    source_url: https://github.com/karpathy/nanoGPT/commit/7399dfe39d24579cc1fb391475864ad28f19f6f7
    reproduce_command: python -c "import torch; from model import GPT, GPTConfig; torch.manual_seed(0); m = GPT(GPTConfig(dropout=0.5, block_size=32, n_layer=1, n_head=1, n_embd=8, vocab_size=65)); m.eval(); idx = torch.randint(0, 65, (1, 32)); l1, _ = m(idx); l2, _ = m(idx); assert torch.allclose(l1, l2), 'eval non-deterministic'"
    verify_command: python -c "import torch; from model import GPT, GPTConfig; torch.manual_seed(0); m = GPT(GPTConfig(dropout=0.5, block_size=32, n_layer=1, n_head=1, n_embd=8, vocab_size=65)); m.eval(); idx = torch.randint(0, 65, (1, 32)); l1, _ = m(idx); l2, _ = m(idx); assert torch.allclose(l1, l2), 'eval non-deterministic'"
    reference_patch: nanogpt-h02/reference.patch
    construction_notes: Historical repair from commit 7399dfe; flash attention ignored eval mode for dropout.
    hidden_test_path: nanogpt-h02/test_hidden.py
    hidden_verify_command: python -m pytest /issueflow-hidden/test_hidden.py
    fixed_revision: 7399dfe39d24579cc1fb391475864ad28f19f6f7
  - id: nanogpt-h03
    dataset_split: strict
    repository_id: nanogpt
    environment_id: nanogpt
    kind: historical
    budget_profile: small
    difficulty: small
    issue_category: model_training
    repository_url: https://github.com/karpathy/nanoGPT
    revision: 57735f532df142cf9d1012061b93ab53e58c462b
    license: MIT
    issue: generate() calls torch.topk(logits, top_k) without clamping, so a top_k larger than the vocabulary size raises a RuntimeError.
    source_url: https://github.com/karpathy/nanoGPT/commit/91d02510ce8c832923d0a6408d983e2d55f0291e
    reproduce_command: python -c "import torch; from model import GPT, GPTConfig; m = GPT(GPTConfig(vocab_size=65, block_size=32, n_layer=1, n_head=1, n_embd=8)); m.eval(); idx = torch.randint(0, 65, (1, 4)); m.generate(idx, max_new_tokens=1, top_k=100)"
    verify_command: python -c "import torch; from model import GPT, GPTConfig; m = GPT(GPTConfig(vocab_size=65, block_size=32, n_layer=1, n_head=1, n_embd=8)); m.eval(); idx = torch.randint(0, 65, (1, 4)); m.generate(idx, max_new_tokens=1, top_k=100)"
    reference_patch: nanogpt-h03/reference.patch
    construction_notes: Historical repair from commit 91d0251; top_k sampling crashed above vocab size.
    hidden_test_path: nanogpt-h03/test_hidden.py
    hidden_verify_command: python -m pytest /issueflow-hidden/test_hidden.py
    fixed_revision: 91d02510ce8c832923d0a6408d983e2d55f0291e
  - id: makemore-h01
    dataset_split: strict
    repository_id: makemore
    environment_id: makemore
    kind: historical
    budget_profile: small
    difficulty: small
    issue_category: model_training
    repository_url: https://github.com/karpathy/makemore
    revision: 2f5e8d746e87b3c8424474e35b702092ed7e9579
    license: MIT
    issue: The RNN forward loop never updates hprev, so every timestep uses the initial hidden state instead of the previous cell output, breaking the recurrence.
    source_url: https://github.com/karpathy/makemore/commit/bf386250141f18f61321bc4b9a56c7b67c0b1668
    reproduce_command: python -c "import torch; from makemore import RNN, ModelConfig; c = ModelConfig(); c.vocab_size = 10; c.block_size = 4; c.n_embd = 8; c.n_embd2 = 8; m = RNN(c, 'rnn'); o1, _ = m(torch.tensor([[1, 2]])); o2, _ = m(torch.tensor([[3, 2]])); assert not torch.allclose(o1[:, -1], o2[:, -1])"
    verify_command: python -c "import torch; from makemore import RNN, ModelConfig; c = ModelConfig(); c.vocab_size = 10; c.block_size = 4; c.n_embd = 8; c.n_embd2 = 8; m = RNN(c, 'rnn'); o1, _ = m(torch.tensor([[1, 2]])); o2, _ = m(torch.tensor([[3, 2]])); assert not torch.allclose(o1[:, -1], o2[:, -1])"
    reference_patch: makemore-h01/reference.patch
    construction_notes: Historical repair from commit bf38625; the RNN hidden state never propagated.
    hidden_test_path: makemore-h01/test_hidden.py
    hidden_verify_command: python -m pytest /issueflow-hidden/test_hidden.py
    fixed_revision: bf386250141f18f61321bc4b9a56c7b67c0b1668
